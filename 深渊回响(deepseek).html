<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深渊回响 · Echoes of the Abyss</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#05060a;
    font-family: "Consolas","Monaco","Courier New", "Microsoft YaHei", monospace;
    color:#b9c6dc;
    user-select:none;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(40,70,140,0.10), transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(120,40,140,0.06), transparent 60%);
    pointer-events:none;
  }
  #wrap {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  #frame {
    width: 1420px; height: 720px;
    display:flex; gap:16px;
    transform-origin: center center;
  }
  #stage { position:relative; width:1104px; height:720px; flex:0 0 auto; }
  canvas {
    display:block;
    border-radius:8px;
    box-shadow:
      0 0 0 1px rgba(110,150,220,0.18),
      0 0 40px rgba(50,90,200,0.12),
      0 20px 60px rgba(0,0,0,0.7);
  }
  #overlay {
    position:absolute; inset:0;
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, rgba(8,12,24,0.82), rgba(2,3,6,0.96));
    border-radius:8px;
    text-align:center;
    backdrop-filter: blur(2px);
  }
  .title {
    font-size:58px; letter-spacing:14px; font-weight:bold;
    color:#dce9ff;
    text-shadow: 0 0 24px rgba(90,150,255,0.85), 0 0 60px rgba(60,110,220,0.5);
    margin-bottom:6px;
  }
  .subtitle {
    font-size:14px; letter-spacing:8px; color:#5a7bb0; margin-bottom:38px;
  }
  .keys {
    font-size:13px; line-height:2.0; color:#7f92b4; margin-bottom:38px;
  }
  .keys b { color:#a9d4ff; font-weight:normal; }
  .prompt {
    font-size:16px; color:#8fd0ff; letter-spacing:4px;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
  .dead-title {
    font-size:50px; letter-spacing:10px; color:#ff5a6e;
    text-shadow:0 0 30px rgba(255,60,90,0.8);
    margin-bottom:16px;
  }
  .dead-stats { font-size:15px; line-height:2.0; color:#98a8c4; margin-bottom:30px; }
  .dead-stats b { color:#ffd76a; font-weight:normal; }
  .win-title {
    font-size:50px; letter-spacing:10px; color:#ffd76a;
    text-shadow:0 0 34px rgba(255,200,80,0.8);
    margin-bottom:16px;
  }

  /* ===== 侧栏 ===== */
  #side { width:300px; display:flex; flex-direction:column; gap:12px; }
  .panel {
    background: linear-gradient(180deg, rgba(18,24,40,0.92), rgba(10,14,24,0.92));
    border:1px solid rgba(90,130,200,0.20);
    border-radius:8px;
    padding:12px 14px;
    box-shadow: inset 0 1px 0 rgba(120,170,255,0.07), 0 8px 24px rgba(0,0,0,0.5);
  }
  .panel h3 {
    font-size:11px; letter-spacing:4px; color:#5d7ba8;
    font-weight:normal; margin-bottom:9px;
    border-bottom:1px solid rgba(90,130,200,0.15);
    padding-bottom:6px;
  }
  #stats { flex:0 0 auto; }
  .srow {
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; padding:2.5px 0; color:#8fa2c0;
  }
  .srow b { color:#d6e4ff; font-weight:normal; font-size:14px; }
  .srow .gold { color:#ffd76a; }
  .srow .lvl { color:#8fe0ff; }
  .hpwrap {
    height:9px; border-radius:5px; background:rgba(255,60,90,0.10);
    border:1px solid rgba(255,80,110,0.22); margin:7px 0 4px; overflow:hidden;
  }
  .hpbar {
    height:100%; border-radius:4px;
    background:linear-gradient(90deg,#ff3355,#ff7755);
    box-shadow:0 0 10px rgba(255,70,90,0.7);
    transition: width 0.18s ease-out;
  }
  .xpwrap {
    height:5px; border-radius:3px; background:rgba(120,200,255,0.08);
    border:1px solid rgba(120,200,255,0.16); margin-bottom:8px; overflow:hidden;
  }
  .xpbar {
    height:100%; background:linear-gradient(90deg,#3aa0ff,#7ce0ff);
    box-shadow:0 0 8px rgba(90,190,255,0.7);
    transition: width 0.18s ease-out;
  }
  #inv { flex:0 0 auto; }
  .islot {
    display:flex; align-items:center; gap:9px;
    font-size:13px; padding:3.5px 0; color:#93a6c4;
  }
  .islot .num {
    display:inline-flex; align-items:center; justify-content:center;
    width:19px; height:19px; flex:0 0 auto;
    border:1px solid rgba(120,160,220,0.30); border-radius:4px;
    font-size:11px; color:#7f9dd0; background:rgba(40,60,100,0.35);
  }
  .islot .nm { flex:1; }
  .islot .ct { color:#ffd76a; }
  .islot.empty { opacity:0.24; }
  #log { flex:1 1 auto; overflow:hidden; display:flex; flex-direction:column; }
  #loglist {
    flex:1; overflow-y:auto; font-size:12.5px; line-height:1.65;
    padding-right:4px;
    scrollbar-width: thin;
    scrollbar-color: rgba(90,130,200,0.4) transparent;
  }
  #loglist::-webkit-scrollbar { width:5px; }
  #loglist::-webkit-scrollbar-thumb { background:rgba(90,130,200,0.35); border-radius:3px; }
  #loglist div { margin-bottom:1px; }

  .hint { font-size:11px; color:#4b5e7e; letter-spacing:1px; margin-top:6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="overlay"></div>
    </div>
    <div id="side">
      <div class="panel" id="stats"></div>
      <div class="panel" id="inv"></div>
      <div class="panel" id="log">
        <h3>日志</h3>
        <div id="loglist"></div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   常量与配置
   ═══════════════════════════════════════════════════════════ */
const MAP_W = 46, MAP_H = 30, TS = 24;
const VW = MAP_W * TS, VH = MAP_H * TS;   // 1104 x 720
const DPR = Math.min(2, window.devicePixelRatio || 1);

const WALL = 0, FLOOR = 1;

const FOV_RADIUS = 8.5;
const MAX_DEPTH = 10;

/* ═══════════════════════════════════════════════════════════
   工具函数
   ═══════════════════════════════════════════════════════════ */
const rnd = n => Math.floor(Math.random() * n);
const rndR = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >> 13)) * 1274126177 | 0;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function parseHex(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function rgba(h, a) { const [r, g, b] = parseHex(h); return `rgba(${r},${g},${b},${a})`; }
function lighten(h, t) {
  const [r, g, b] = parseHex(h);
  return `rgb(${(r + (255 - r) * t) | 0},${(g + (255 - g) * t) | 0},${(b + (255 - b) * t) | 0})`;
}

/* ═══════════════════════════════════════════════════════════
   Canvas 初始化
   ═══════════════════════════════════════════════════════════ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = VW * DPR; cv.height = VH * DPR;
cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
ctx.scale(DPR, DPR);

const terrainCv = document.createElement('canvas');
terrainCv.width = VW * DPR; terrainCv.height = VH * DPR;
const tctx = terrainCv.getContext('2d');
tctx.scale(DPR, DPR);

const overlay = document.getElementById('overlay');
const loglist = document.getElementById('loglist');

/* ═══════════════════════════════════════════════════════════
   游戏数据
   ═══════════════════════════════════════════════════════════ */
let map, explored, visible, rooms, monsters, items, stairs;
let player, depth, turnCount, messages, gameState;
let particles = [], floaters = [];
let shake = 0, terrainDirty = true, logDirty = true;
let hitFlash = 0;

/* ─── 怪物图鉴 ─── */
const MONSTER_TYPES = {
  rat:       { name:'巨鼠',     hp:7,   atk:3,  def:0,  speed:120, xp:6,   color:'#9b7a63', size:0.28, shape:'rat' },
  goblin:    { name:'哥布林',   hp:11,  atk:5,  def:1,  speed:100, xp:10,  color:'#5fb04a', size:0.34, shape:'ear' },
  skeleton:  { name:'骷髅兵',   hp:16,  atk:7,  def:2,  speed:100, xp:16,  color:'#cfcfc0', size:0.35, shape:'skull' },
  orc:       { name:'兽人',     hp:24,  atk:10, def:3,  speed:100, xp:26,  color:'#3f7a3f', size:0.40, shape:'ear' },
  wraith:    { name:'幽魂',     hp:20,  atk:13, def:2,  speed:130, xp:36,  color:'#6fa8ff', size:0.36, shape:'ghost' },
  troll:     { name:'巨魔',     hp:38,  atk:16, def:5,  speed:90,  xp:55,  color:'#8a6a4a', size:0.44, shape:'horn' },
  demon:     { name:'恶魔',     hp:55,  atk:22, def:6,  speed:110, xp:85,  color:'#e0503a', size:0.44, shape:'horn' },
  demonlord: { name:'深渊之主', hp:240, atk:30, def:11, speed:120, xp:600, color:'#ff2f5f', size:0.62, shape:'horn', boss:true },
};

/* ─── 物品图鉴 ─── */
const ITEMS = {
  potion:   { name:'治疗药水', color:'#ff5577', desc:'恢复 25 生命' },
  strength: { name:'力量药剂', color:'#ff8833', desc:'永久 +2 攻击' },
  armor:    { name:'铁甲片',   color:'#8899bb', desc:'永久 +1 防御' },
  teleport: { name:'传送卷轴', color:'#aa77ff', desc:'随机传送' },
  fireball: { name:'火球卷轴', color:'#ff6622', desc:'对最近敌人造成 25+ 伤害' },
  mapping:  { name:'探测卷轴', color:'#55ddff', desc:'揭示整层地图' },
};
const ITEM_ORDER = ['potion', 'strength', 'armor', 'teleport', 'fireball', 'mapping'];

/* ═══════════════════════════════════════════════════════════
   消息系统
   ═══════════════════════════════════════════════════════════ */
function msg(text, color) {
  messages.push({ text, color: color || '#93a6c4' });
  if (messages.length > 120) messages.shift();
  logDirty = true;
}
function renderLog() {
  loglist.innerHTML = messages.slice(-60)
    .map(m => `<div style="color:${m.color}">${m.text}</div>`).join('');
  loglist.scrollTop = loglist.scrollHeight;
  logDirty = false;
}

/* ═══════════════════════════════════════════════════════════
   特效
   ═══════════════════════════════════════════════════════════ */
function addFloater(gx, gy, text, color) {
  floaters.push({ x: gx * TS + TS / 2, y: gy * TS + TS / 2, text, color, life: 1 });
}
function addParticles(gx, gy, color, count, spd) {
  const cx = gx * TS + TS / 2, cy = gy * TS + TS / 2;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (0.4 + Math.random()) * (spd || 1.6);
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.6,
      life: 0.75 + Math.random() * 0.45,
      max: 1.2, color, r: 1.4 + Math.random() * 2.6
    });
  }
}

/* ═══════════════════════════════════════════════════════════
   关卡生成
   ═══════════════════════════════════════════════════════════ */
function carveH(x1, x2, y) {
  for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) map[y * MAP_W + x] = FLOOR;
}
function carveV(y1, y2, x) {
  for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) map[y * MAP_W + x] = FLOOR;
}
function connectRooms(a, b) {
  const ax = a.x + (a.w >> 1), ay = a.y + (a.h >> 1);
  const bx = b.x + (b.w >> 1), by = b.y + (b.h >> 1);
  if (Math.random() < 0.5) { carveH(ax, bx, ay); carveV(ay, by, bx); }
  else { carveV(ay, by, ax); carveH(ax, bx, by); }
}

function monsterPool(d) {
  const pools = [
    ['rat', 'goblin'],
    ['goblin', 'skeleton'],
    ['skeleton', 'orc'],
    ['orc', 'wraith'],
    ['wraith', 'troll'],
    ['troll', 'demon'],
    ['demon', 'troll'],
  ];
  return pools[clamp(d - 1, 0, pools.length - 1)];
}

function spawnMonster(type, x, y) {
  const base = MONSTER_TYPES[type];
  const s = 1 + (depth - 1) * 0.07;
  monsters.push({
    type, x, y, px: x * TS, py: y * TS,
    hp: Math.round(base.hp * s),
    maxhp: Math.round(base.hp * s),
    atk: Math.round(base.atk * (1 + (depth - 1) * 0.06)),
    def: base.def,
    speed: base.speed,
    xp: base.xp,
    color: base.color,
    size: base.size,
    shape: base.shape,
    boss: !!base.boss,
    name: base.name,
    energy: 0,
    awake: false,
    seed: Math.random(),
    attackAnim: 0,
    flash: 0,
    isPlayer: false,
  });
}

function generateLevel() {
  map = new Uint8Array(MAP_W * MAP_H);
  explored = new Uint8Array(MAP_W * MAP_H);
  visible = new Uint8Array(MAP_W * MAP_H);
  rooms = [];
  monsters = [];
  items = [];
  particles = [];
  floaters = [];

  // 房间布局
  for (let i = 0; i < 400 && rooms.length < 13; i++) {
    const w = rndR(5, 11), h = rndR(4, 7);
    const x = rndR(1, MAP_W - w - 2), y = rndR(1, MAP_H - h - 2);
    const nr = { x, y, w, h };
    if (rooms.some(r =>
      !(nr.x + nr.w + 1 < r.x || r.x + r.w + 1 < nr.x ||
        nr.y + nr.h + 1 < r.y || r.y + r.h + 1 < nr.y))) continue;
    rooms.push(nr);
  }

  // 挖掘房间
  for (const r of rooms)
    for (let y = r.y; y < r.y + r.h; y++)
      for (let x = r.x; x < r.x + r.w; x++)
        map[y * MAP_W + x] = FLOOR;

  // 走廊连接
  for (let i = 1; i < rooms.length; i++) connectRooms(rooms[i - 1], rooms[i]);
  for (let k = 0; k < 3; k++) {
    const a = rooms[rnd(rooms.length)], b = rooms[rnd(rooms.length)];
    if (a !== b) connectRooms(a, b);
  }

  // 玩家出生
  const start = rooms[0];
  player.x = start.x + (start.w >> 1);
  player.y = start.y + (start.h >> 1);
  player.px = player.x * TS;
  player.py = player.y * TS;
  player.energy = 100;

  // 楼梯放在最远房间
  let far = rooms[0], best = -1;
  for (const r of rooms) {
    const d = Math.abs(r.x - start.x) + Math.abs(r.y - start.y);
    if (d > best) { best = d; far = r; }
  }
  stairs = { x: far.x + (far.w >> 1), y: far.y + (far.h >> 1) };

  // 放置怪物
  const pool = monsterPool(depth);
  const count = 4 + Math.min(9, depth * 2);
  for (let i = 0; i < count; i++) {
    const r = rooms[rnd(rooms.length)];
    const x = rndR(r.x, r.x + r.w - 1), y = rndR(r.y, r.y + r.h - 1);
    if (Math.abs(x - player.x) + Math.abs(y - player.y) < 6) continue;
    if (x === stairs.x && y === stairs.y) continue;
    if (monsters.some(m => m.x === x && m.y === y)) continue;
    spawnMonster(pool[rnd(pool.length)], x, y);
  }

  // BOSS
  if (depth === MAX_DEPTH) {
    spawnMonster('demonlord', stairs.x, Math.max(1, stairs.y - 2));
    msg('空气凝固了……有什么东西在深处呼吸。', '#ff5a7a');
  }

  // 放置物品
  const itemCount = rndR(4, 7);
  for (let i = 0; i < itemCount; i++) {
    const r = rooms[rnd(rooms.length)];
    const x = rndR(r.x, r.x + r.w - 1), y = rndR(r.y, r.y + r.h - 1);
    if (map[y * MAP_W + x] !== FLOOR) continue;
    if (items.some(it => it.x === x && it.y === y)) continue;
    if (x === player.x && y === player.y) continue;
    let key;
    const roll = Math.random();
    if (roll < 0.42) key = 'potion';
    else if (roll < 0.55) key = 'strength';
    else if (roll < 0.68) key = 'armor';
    else if (roll < 0.78) key = 'teleport';
    else if (roll < 0.90) key = 'fireball';
    else key = 'mapping';
    items.push({ x, y, key, seed: Math.random() });
  }

  computeFOV();
  terrainDirty = true;
}

/* ═══════════════════════════════════════════════════════════
   视野
   ═══════════════════════════════════════════════════════════ */
function hasLOS(x0, y0, x1, y1) {
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0, guard = 0;
  while (guard++ < 200) {
    if (x === x1 && y === y1) return true;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
    if (x === x1 && y === y1) return true;
    if (map[y * MAP_W + x] === WALL) return false;
  }
  return false;
}

function computeFOV() {
  visible.fill(0);
  const R = FOV_RADIUS, px = player.x, py = player.y;
  const ri = Math.ceil(R);
  for (let y = py - ri; y <= py + ri; y++) {
    for (let x = px - ri; x <= px + ri; x++) {
      if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) continue;
      const dx = x - px, dy = y - py;
      if (dx * dx + dy * dy > R * R) continue;
      if (hasLOS(px, py, x, y)) {
        const i = y * MAP_W + x;
        visible[i] = 1;
        explored[i] = 1;
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   实体查询
   ═══════════════════════════════════════════════════════════ */
function monsterAt(x, y) {
  for (const m of monsters) if (m.hp > 0 && m.x === x && m.y === y) return m;
  return null;
}
function itemAt(x, y) {
  return items.find(it => it.x === x && it.y === y);
}

/* ═══════════════════════════════════════════════════════════
   战斗
   ═══════════════════════════════════════════════════════════ */
function attack(attacker, target) {
  const isPlayerAttacking = (attacker === player);
  let dmg = Math.max(1, attacker.atk + rnd(5) - 2 - target.def);
  const crit = Math.random() < 0.10;
  if (crit) dmg = Math.round(dmg * 1.9);

  target.hp -= dmg;
  target.flash = 1;
  attacker.attackAnim = 1;

  addFloater(target.x, target.y, '-' + dmg, isPlayerAttacking ? (crit ? '#ffdd44' : '#ffb055') : '#ff5566');
  addParticles(target.x, target.y, isPlayerAttacking ? '#ffb055' : '#ff5566', crit ? 14 : 7, crit ? 3 : 2);

  if (!isPlayerAttacking) {
    shake = crit ? 9 : 5;
    hitFlash = 0.55;
  }

  if (isPlayerAttacking) {
    msg(`你击中${target.name}，造成 ${dmg} 点伤害${crit ? '（暴击！）' : ''}。`, crit ? '#ffdd44' : '#c8d6ee');
  } else {
    msg(`${attacker.name}击中你，造成 ${dmg} 点伤害${crit ? '（暴击！）' : ''}。`, '#ff7788');
  }

  if (target.hp <= 0) kill(target);
}

function kill(target) {
  if (target === player) { die(); return; }
  target.hp = 0;
  addParticles(target.x, target.y, target.color, 22, 3);
  msg(`你击杀了${target.name}。`, '#8fe0a0');
  gainXP(target.xp);
  if (Math.random() < 0.18 && !target.boss) {
    const r = rooms[rnd(rooms.length)];
    // 掉落物品在怪物位置
    let key = Math.random() < 0.7 ? 'potion' : 'teleport';
    if (!items.some(it => it.x === target.x && it.y === target.y))
      items.push({ x: target.x, y: target.y, key, seed: Math.random() });
  }
  if (target.boss) win();
}

function gainXP(amount) {
  player.xp += amount;
  while (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.floor(player.xpNext * 1.55);
    player.maxhp += 10;
    player.hp = player.maxhp;
    player.atk += 2;
    player.def += 1;
    msg(`★ 升级！你现在是 ${player.level} 级。`, '#ffd76a');
    addFloater(player.x, player.y - 1, 'LEVEL UP', '#ffd76a');
    addParticles(player.x, player.y, '#ffd76a', 28, 3);
  }
}

/* ═══════════════════════════════════════════════════════════
   回合驱动
   ═══════════════════════════════════════════════════════════ */
function finishTurn() {
  player.energy -= 100;
  runTurns();
  turnCount++;
  computeFOV();
  terrainDirty = true;
  updateSidebar();
  if (player.hp <= 0) die();
}

function runTurns() {
  let guard = 0;
  while (guard++ < 8000) {
    if (player.hp <= 0) return;
    if (player.energy >= 100) return;

    const ready = monsters.filter(m => m.hp > 0 && m.energy >= 100);
    if (ready.length === 0) {
      player.energy += player.speed;
      for (const m of monsters) if (m.hp > 0) m.energy += m.speed;
      continue;
    }
    for (const m of ready) {
      if (m.hp <= 0) continue;
      monsterAct(m);
      m.energy -= 100;
      if (player.hp <= 0) return;
    }
    if (player.energy >= 100) return;
  }
}

function monsterAct(m) {
  const dx = player.x - m.x, dy = player.y - m.y;
  const dist = Math.max(Math.abs(dx), Math.abs(dy));

  if (dist <= 11 && hasLOS(m.x, m.y, player.x, player.y)) m.awake = true;

  if (!m.awake) {
    if (Math.random() < 0.28) {
      const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
      const [ox, oy] = dirs[rnd(4)];
      tryMonsterMove(m, ox, oy);
    }
    return;
  }

  if (dist <= 1) { attack(m, player); return; }

  const sx = Math.sign(dx), sy = Math.sign(dy);
  const opts = [];
  if (Math.abs(dx) > Math.abs(dy)) { opts.push([sx, 0], [0, sy], [sx, sy]); }
  else { opts.push([0, sy], [sx, 0], [sx, sy]); }
  if (Math.random() < 0.25) opts.reverse();

  for (const [ox, oy] of opts) {
    if (ox === 0 && oy === 0) continue;
    if (tryMonsterMove(m, ox, oy)) return;
  }
}

function tryMonsterMove(m, dx, dy) {
  const nx = m.x + dx, ny = m.y + dy;
  if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) return false;
  if (map[ny * MAP_W + nx] === WALL) return false;
  if (nx === player.x && ny === player.y) return false;
  if (monsterAt(nx, ny)) return false;
  m.x = nx; m.y = ny;
  return true;
}

/* ═══════════════════════════════════════════════════════════
   玩家行为
   ═══════════════════════════════════════════════════════════ */
function tryMove(dx, dy) {
  if (gameState !== 'play') return;
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) return;
  if (map[ny * MAP_W + nx] === WALL) return;

  const m = monsterAt(nx, ny);
  if (m) { attack(player, m); finishTurn(); return; }

  player.x = nx; player.y = ny;
  pickupAt(nx, ny);
  finishTurn();
}

function pickupAt(x, y) {
  const it = itemAt(x, y);
  if (!it) return;
  const def = ITEMS[it.key];
  player.inv[it.key] = (player.inv[it.key] || 0) + 1;
  items.splice(items.indexOf(it), 1);
  msg(`拾取：${def.name}。`, def.color);
  addParticles(x, y, def.color, 8, 1.2);
}

function useItem(idx) {
  if (gameState !== 'play') return;
  const key = ITEM_ORDER[idx];
  if (!key || !player.inv[key]) { msg('你没有这个物品。', '#66788f'); return; }
  const def = ITEMS[key];

  if (key === 'potion') {
    if (player.hp >= player.maxhp) { msg('你的生命已满。', '#66788f'); return; }
    const heal = Math.min(25, player.maxhp - player.hp);
    player.hp += heal;
    addFloater(player.x, player.y, '+' + heal, '#7cffa8');
    addParticles(player.x, player.y, '#7cffa8', 14, 2);
    msg(`你饮下药水，恢复了 ${heal} 点生命。`, '#7cffa8');
  }
  else if (key === 'strength') {
    player.atk += 2;
    msg('力量涌入四肢，攻击力 +2。', '#ff8833');
    addParticles(player.x, player.y, '#ff8833', 18, 2.4);
  }
  else if (key === 'armor') {
    player.def += 1;
    msg('铁甲片嵌入皮肉，防御 +1。', '#8899bb');
    addParticles(player.x, player.y, '#8899bb', 18, 2.4);
  }
  else if (key === 'teleport') {
    let tx, ty, tries = 0;
    do {
      tx = rndR(1, MAP_W - 2); ty = rndR(1, MAP_H - 2);
      tries++;
    } while (map[ty * MAP_W + tx] !== FLOOR && tries < 600);
    addParticles(player.x, player.y, '#aa77ff', 24, 3);
    player.x = tx; player.y = ty;
    player.px = tx * TS; player.py = ty * TS;
    addParticles(tx, ty, '#aa77ff', 24, 3);
    msg('空间扭曲，你被传送到别处。', '#aa77ff');
    computeFOV();
    terrainDirty = true;
  }
  else if (key === 'fireball') {
    let target = null, bestD = 1e9;
    for (const m of monsters) {
      if (m.hp <= 0) continue;
      const i = m.y * MAP_W + m.x;
      if (!visible[i]) continue;
      const d = Math.abs(m.x - player.x) + Math.abs(m.y - player.y);
      if (d < bestD) { bestD = d; target = m; }
    }
    if (!target) { msg('视野中没有敌人。', '#66788f'); return; }
    const dmg = 25 + player.level * 3;
    target.hp -= dmg;
    target.flash = 1;
    addFloater(target.x, target.y, '-' + dmg, '#ff8833');
    addParticles(target.x, target.y, '#ff8833', 30, 3.5);
    msg(`火球吞噬了${target.name}，造成 ${dmg} 点伤害。`, '#ff8833');
    if (target.hp <= 0) kill(target);
  }
  else if (key === 'mapping') {
    for (let i = 0; i < explored.length; i++) explored[i] = 1;
    msg('整层地牢的结构在你脑中展开。', '#55ddff');
    terrainDirty = true;
  }

  player.inv[key]--;
  if (player.inv[key] <= 0) delete player.inv[key];
  finishTurn();
}

function descend() {
  if (gameState !== 'play') return;
  if (player.x !== stairs.x || player.y !== stairs.y) {
    msg('这里没有向下的楼梯。', '#66788f');
    return;
  }
  if (depth >= MAX_DEPTH) { msg('这里已是最深处。', '#66788f'); return; }
  depth++;
  msg(`你走下楼梯，来到地下 ${depth} 层。`, '#aaccff');
  generateLevel();
  updateSidebar();
}

function wait() {
  if (gameState !== 'play') return;
  msg('你屏息等待。', '#66788f');
  finishTurn();
}

/* ═══════════════════════════════════════════════════════════
   死亡 / 胜利
   ═══════════════════════════════════════════════════════════ */
function die() {
  if (gameState !== 'play') return;
  gameState = 'dead';
  player.hp = 0;
  addParticles(player.x, player.y, '#ff3355', 60, 4);
  shake = 16;
  msg('你倒下了……', '#ff4455');
  const score = depth * 120 + player.level * 80 + turnCount;
  setTimeout(() => {
    overlay.innerHTML = `
      <div class="dead-title">你 死 了</div>
      <div class="dead-stats">
        抵达深度 &nbsp;<b>地下 ${depth} 层</b><br>
        角色等级 &nbsp;<b>Lv.${player.level}</b><br>
        存活回合 &nbsp;<b>${turnCount}</b><br>
        <span style="color:#5d7ba8">最终得分</span> &nbsp;<b>${score}</b>
      </div>
      <div class="prompt">按 R 重新开始</div>`;
    overlay.style.display = 'flex';
  }, 700);
}

function win() {
  if (gameState !== 'play') return;
  gameState = 'win';
  addParticles(player.x, player.y, '#ffd76a', 90, 5);
  shake = 18;
  const score = depth * 120 + player.level * 80 + turnCount + 3000;
  setTimeout(() => {
    overlay.innerHTML = `
      <div class="win-title">深 渊 已 平 息</div>
      <div class="dead-stats">
        你击杀了深渊之主，封印了这道裂隙。<br><br>
        角色等级 &nbsp;<b>Lv.${player.level}</b><br>
        存活回合 &nbsp;<b>${turnCount}</b><br>
        <span style="color:#5d7ba8">最终得分</span> &nbsp;<b>${score}</b>
      </div>
      <div class="prompt">按 R 重新开始</div>`;
    overlay.style.display = 'flex';
  }, 700);
}

/* ═══════════════════════════════════════════════════════════
   新游戏
   ═══════════════════════════════════════════════════════════ */
function newGame() {
  depth = 1;
  turnCount = 0;
  messages = [];
  particles = [];
  floaters = [];
  shake = 0;
  hitFlash = 0;

  player = {
    x: 0, y: 0, px: 0, py: 0,

    level: 1, xp: 0, xpNext: 20,

  msg('数字键 1-6 使用物品，站在 ⌄ 上按回车下楼。', '#5d7ba8');

}

/* ═══════════════════════════════════════════════════════════
   侧栏 UI
   ═══════════════════════════════════════════════════════════ */
function updateSidebar() {
  if (!player) return;
  const hpPct = clamp(player.hp / player.maxhp, 0, 1) * 100;
  const xpPct = clamp(player.xp / player.xpNext, 0, 1) * 100;
  document.getElementById('stats').innerHTML = `
    <h3>状 态</h3>
    <div class="srow"><span>生命</span><b>${Math.max(0, player.hp)} / ${player.maxhp}</b></div>
    <div class="hpwrap"><div class="hpbar" style="width:${hpPct}%"></div></div>
    <div class="srow"><span>等级</span><b class="lvl">Lv.${player.level}</b></div>
    <div class="xpwrap"><div class="xpbar" style="width:${xpPct}%"></div></div>
    <div class="srow"><span>攻击 / 防御</span><b>${player.atk} / ${player.def}</b></div>
    <div class="srow"><span>深度</span><b>地下 ${depth} 层</b></div>
    <div class="srow"><span>回合</span><b>${turnCount}</b></div>
  `;

  let invHtml = '<h3>物 品</h3>';
  for (let i = 0; i < ITEM_ORDER.length; i++) {
    const k = ITEM_ORDER[i];
    const c = player.inv[k] || 0;
    const def = ITEMS[k];
    if (c > 0) {
      invHtml += `<div class="islot">
        <span class="num">${i + 1}</span>
        <span class="nm" style="color:${def.color}">${def.name}</span>
        <span class="ct">×${c}</span>
      </div>`;
    } else {
      invHtml += `<div class="islot empty">
        <span class="num">${i + 1}</span>
        <span class="nm">——</span>
      </div>`;
    }
  }
  document.getElementById('inv').innerHTML = invHtml;
  logDirty = true;
}

/* ═══════════════════════════════════════════════════════════
   渲染 —— 地形烘焙
   ═══════════════════════════════════════════════════════════ */
function drawWallTile(c, px, py, seed, vis) {
  const v = 0.35 + seed * 0.65;
  const lit = vis ? 1 : 0.45;
  c.fillStyle = `hsl(222, 20%, ${(9 + v * 6) * lit}%)`;
  c.fillRect(px, py, TS, TS);

  // 砖块纹理
  const bh = TS / 2;
  for (let r = 0; r < 2; r++) {
    const off = (r % 2) * (TS / 2);
    c.fillStyle = `rgba(150,180,230,${0.030 * lit})`;
    c.fillRect(px, py + r * bh, TS, 1);
    c.fillStyle = `rgba(0,0,0,${0.28 * lit})`;
    c.fillRect(px + (off + TS / 2) % TS, py + r * bh, 1, bh);
  }

  // 顶部高光
  c.fillStyle = `rgba(140,180,255,${0.13 * lit})`;
  c.fillRect(px, py, TS, 2);
  // 左侧微光
  c.fillStyle = `rgba(140,180,255,${0.05 * lit})`;
  c.fillRect(px, py, 2, TS);
  // 底部阴影
  c.fillStyle = `rgba(0,0,0,${0.42 * lit})`;
  c.fillRect(px, py + TS - 2, TS, 2);
}

function drawFloorTile(c, px, py, seed, vis) {
  const v = 0.4 + seed * 0.6;
  const lit = vis ? 1 : 0.4;
  const hue = 226 - seed * 10;
  c.fillStyle = `hsl(${hue}, 16%, ${(6.5 + v * 4) * lit}%)`;
  c.fillRect(px, py, TS, TS);

  // 石板缝
  c.strokeStyle = `rgba(130,165,225,${0.035 * lit})`;
  c.lineWidth = 1;
  c.strokeRect(px + 0.5, py + 0.5, TS - 1, TS - 1);

  // 细碎噪点
  if (seed > 0.72) {
    c.fillStyle = `rgba(160,190,240,${0.030 * lit})`;
    c.fillRect(px + (seed * 13) % (TS - 4), py + (seed * 29) % (TS - 4), 2, 2);
  }
}

function buildTerrain() {
  tctx.clearRect(0, 0, VW, VH);
  tctx.fillStyle = '#04050a';
  tctx.fillRect(0, 0, VW, VH);

  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const i = y * MAP_W + x;
      if (!explored[i]) continue;
      const vis = visible[i] === 1;
      const px = x * TS, py = y * TS;
      const seed = hash2(x, y);

      if (map[i] === WALL) drawWallTile(tctx, px, py, seed, vis);
      else drawFloorTile(tctx, px, py, seed, vis);

      if (!vis) {
        tctx.fillStyle = 'rgba(3,4,10,0.66)';
        tctx.fillRect(px, py, TS, TS);
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   渲染 —— 实体
   ═══════════════════════════════════════════════════════════ */
function drawStairs(t) {
  const i = stairs.y * MAP_W + stairs.x;
  if (!explored[i]) return;
  const vis = visible[i] === 1;
  const cx = stairs.x * TS + TS / 2;
  const cy = stairs.y * TS + TS / 2;
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.0035);

  ctx.save();
  ctx.globalAlpha = vis ? 1 : 0.3;

  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, TS * 1.7);
  g.addColorStop(0, `rgba(140,100,255,${0.30 + 0.22 * pulse})`);
  g.addColorStop(1, 'rgba(140,100,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, TS * 1.7, 0, 7); ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, TS * (0.30 + 0.04 * pulse), 0, 7);
  ctx.fillStyle = `rgba(175,145,255,${0.85})`;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, TS * 0.15, 0, 7);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  // 旋转环
  ctx.strokeStyle = `rgba(200,180,255,${0.45 + 0.3 * pulse})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, TS * 0.40, t * 0.002, t * 0.002 + Math.PI * 1.4);
  ctx.stroke();

  ctx.restore();
}

function drawItem(it, t) {
  const i = it.y * MAP_W + it.x;
  if (!explored[i]) return;
  const vis = visible[i] === 1;
  const cx = it.x * TS + TS / 2;
  const cy = it.y * TS + TS / 2;
  const bob = Math.sin(t * 0.003 + it.seed * 10) * 2;
  const col = ITEMS[it.key].color;

  ctx.save();
  ctx.globalAlpha = vis ? 1 : 0.3;

  const g = ctx.createRadialGradient(cx, cy + bob, 0, cx, cy + bob, TS * 0.95);
  g.addColorStop(0, rgba(col, 0.5));
  g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy + bob, TS * 0.95, 0, 7); ctx.fill();

  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(cx, cy + bob - 6.5);
  ctx.lineTo(cx + 5, cy + bob);
  ctx.lineTo(cx, cy + bob + 6.5);
  ctx.lineTo(cx - 5, cy + bob);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.restore();
}

function drawCreature(e, t, isPlayer) {
  const cx = e.px + TS / 2;
  const cy = e.py + TS / 2 + Math.sin(t * 0.0032 + e.seed * 12) * 1.4;
  const r = TS * e.size;
  const col = e.color;
  const flash = e.flash > 0 ? e.flash : 0;

  // 攻击时的位移
  let ox = 0, oy = 0;
  if (e.attackAnim > 0) {
    const a = e.attackAnim;
    ox = Math.sin(a * Math.PI) * 4 * (e.lastDirX || 0);
    oy = Math.sin(a * Math.PI) * 4 * (e.lastDirY || 0);
  }
  const X = cx + ox, Y = cy + oy;

  ctx.save();

  // 外发光
  const g = ctx.createRadialGradient(X, Y, r * 0.2, X, Y, r * 2.6);
  g.addColorStop(0, rgba(col, 0.40 + flash * 0.4));
  g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(X, Y, r * 2.6, 0, 7); ctx.fill();

  // 地面阴影
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 1.0, r * 0.92, r * 0.34, 0, 0, 7);
  ctx.fill();

  // 身体渐变
  const bg = ctx.createRadialGradient(X - r * 0.35, Y - r * 0.45, r * 0.08, X, Y, r * 1.05);
  bg.addColorStop(0, lighten(col, 0.42));
  bg.addColorStop(0.65, col);
  bg.addColorStop(1, lighten(col, -0.35));
  ctx.fillStyle = bg;

  // 形状
  if (e.shape === 'ghost') {
    ctx.beginPath();
    ctx.arc(X, Y - r * 0.15, r * 0.85, Math.PI, 0);
    ctx.lineTo(X + r * 0.85, Y + r * 0.75);
    for (let k = 0; k < 4; k++) {
      const wx = X + r * 0.85 - (k + 0.5) * (r * 1.7 / 4);
      ctx.quadraticCurveTo(wx + r * 0.2, Y + r * 0.45, wx - r * 0.2, Y + r * 0.75);
    }
    ctx.closePath();
    ctx.globalAlpha = 0.86;
    ctx.fill();
  } else if (e.shape === 'rat') {
    ctx.beginPath();
    ctx.ellipse(X, Y, r * 1.15, r * 0.78, 0, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(X + r * 0.9, Y - r * 0.1, r * 0.42, 0, 7);
    ctx.fill();
  } else if (e.shape === 'skull') {
    ctx.beginPath();
    ctx.arc(X, Y - r * 0.1, r * 0.82, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(X - r * 0.45, Y + r * 0.5);
    ctx.lineTo(X + r * 0.45, Y + r * 0.5);
    ctx.lineTo(X + r * 0.3, Y + r * 0.95);
    ctx.lineTo(X - r * 0.3, Y + r * 0.95);
    ctx.closePath();
    ctx.fill();
  } else if (e.shape === 'horn') {
    ctx.beginPath();
    ctx.arc(X, Y, r, 0, 7);
    ctx.fill();
    // 角
    ctx.beginPath();
    ctx.moveTo(X - r * 0.65, Y - r * 0.65);
    ctx.quadraticCurveTo(X - r * 1.4, Y - r * 1.5, X - r * 0.55, Y - r * 1.35);
    ctx.quadraticCurveTo(X - r * 0.6, Y - r * 0.95, X - r * 0.30, Y - r * 0.80);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(X + r * 0.65, Y - r * 0.65);
    ctx.quadraticCurveTo(X + r * 1.4, Y - r * 1.5, X + r * 0.55, Y - r * 1.35);
    ctx.quadraticCurveTo(X + r * 0.6, Y - r * 0.95, X + r * 0.30, Y - r * 0.80);
    ctx.closePath();
    ctx.fill();
  } else if (e.shape === 'ear') {
    ctx.beginPath();
    ctx.arc(X, Y, r, 0, 7);
    ctx.fill();
    // 尖耳
    ctx.beginPath();
    ctx.moveTo(X - r * 0.55, Y - r * 0.55);
    ctx.lineTo(X - r * 1.35, Y - r * 1.25);
    ctx.lineTo(X - r * 0.20, Y - r * 0.90);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(X + r * 0.55, Y - r * 0.55);
    ctx.lineTo(X + r * 1.35, Y - r * 1.25);
    ctx.lineTo(X + r * 0.20, Y - r * 0.90);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(X, Y, r, 0, 7);
    ctx.fill();
  }

  ctx.globalAlpha = 1;

  // 描边
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // 受击白闪
  if (flash > 0) {
    ctx.globalAlpha = flash * 0.8;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(X, Y, r * 1.05, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 眼睛
  const eyeY = Y - r * 0.12;
  const eyeSpacing = r * 0.34;
  const eyeR = Math.max(1.4, r * 0.16);
  ctx.fillStyle = isPlayer ? '#dff4ff' : (e.boss ? '#ffe066' : '#ffdd88');
  ctx.shadowColor = isPlayer ? '#7fd4ff' : '#ff8844';
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(X - eyeSpacing, eyeY, eyeR, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(X + eyeSpacing, eyeY, eyeR, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawPlayerEntity(t) {
  const cx = player.px + TS / 2;
  const cy = player.py + TS / 2 + Math.sin(t * 0.004) * 1.2;
  const r = TS * 0.36;

  ctx.save();

  // 光环
  const g = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 3.2);
  g.addColorStop(0, 'rgba(120,210,255,0.32)');
  g.addColorStop(1, 'rgba(120,210,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, r * 3.2, 0, 7); ctx.fill();

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 1.1, r * 0.95, r * 0.36, 0, 0, 7);
  ctx.fill();

  // 斗篷
  const cg = ctx.createLinearGradient(cx, cy - r * 1.6, cx, cy + r * 1.2);
  cg.addColorStop(0, '#8fd8ff');
  cg.addColorStop(0.5, '#3f8fd0');
  cg.addColorStop(1, '#1b3d66');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(cx - r * 1.0, cy + r * 1.05);
  ctx.quadraticCurveTo(cx - r * 0.95, cy - r * 0.6, cx, cy - r * 1.15);
  ctx.quadraticCurveTo(cx + r * 0.95, cy - r * 0.6, cx + r * 1.0, cy + r * 1.05);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(10,25,45,0.6)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // 兜帽
  ctx.fillStyle = '#d8f0ff';
  ctx.beginPath();
  ctx.arc(cx, cy - r * 0.55, r * 0.56, 0, 7);
  ctx.fill();

  // 兜帽阴影
  ctx.fillStyle = 'rgba(20,40,70,0.85)';
  ctx.beginPath();
  ctx.arc(cx, cy - r * 0.42, r * 0.42, 0, Math.PI);
  ctx.fill();

  // 眼睛
  ctx.fillStyle = '#a8f0ff';
  ctx.shadowColor = '#7fd4ff';
  ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(cx - r * 0.19, cy - r * 0.40, 1.7, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + r * 0.19, cy - r * 0.40, 1.7, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;

  // 脚下光环
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.003);
  ctx.strokeStyle = `rgba(130,210,255,${0.28 + 0.22 * pulse})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 1.05, r * 1.15, r * 0.42, 0, 0, 7);
  ctx.stroke();

  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════
   渲染 —— 主循环
   ═══════════════════════════════════════════════════════════ */
function render(t) {
  ctx.save();

  ctx.fillStyle = '#04050a';
  ctx.fillRect(0, 0, VW, VH);

  // 屏幕震动
  if (shake > 0.4) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  // 地形
  if (terrainDirty) { buildTerrain(); terrainDirty = false; }
  ctx.drawImage(terrainCv, 0, 0, VW, VH);

  // 楼梯
  drawStairs(t);

  // 物品
  for (const it of items) drawItem(it, t);

  // 怪物
  for (const m of monsters) {
    if (m.hp <= 0) continue;
    if (!visible[m.y * MAP_W + m.x]) continue;
    drawCreature(m, t, false);
  }

  // 玩家
  if (player && gameState !== 'dead') drawPlayerEntity(t);

  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 漂浮文字
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px Consolas, monospace';
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.life, 0, 1);
    ctx.fillStyle = '#000';
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // 暗角（跟随玩家）
  if (player) {
    const cx = player.px + TS / 2, cy = player.py + TS / 2;
    const vg = ctx.createRadialGradient(cx, cy, TS * 3.5, cx, cy, TS * 13);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.55, 'rgba(0,0,0,0.28)');
    vg.addColorStop(1, 'rgba(0,0,0,0.78)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, VW, VH);
  }

  // 受击红闪
  if (hitFlash > 0) {
    ctx.fillStyle = `rgba(255,30,50,${hitFlash * 0.28})`;
    ctx.fillRect(0, 0, VW, VH);
  }

  // 标题画面时轻微压暗
  if (gameState === 'title') {
    ctx.fillStyle = 'rgba(2,4,10,0.45)';
    ctx.fillRect(0, 0, VW, VH);
  }
}

/* ═══════════════════════════════════════════════════════════
   更新循环
   ═══════════════════════════════════════════════════════════ */
let lastT = 0;

function update(dt) {
  const k = 1 - Math.exp(-dt * 0.024);

  // 玩家位置插值
  if (player) {
    player.px += (player.x * TS - player.px) * k;
    player.py += (player.y * TS - player.py) * k;
    if (player.attackAnim > 0) player.attackAnim = Math.max(0, player.attackAnim - dt * 0.006);
    if (player.flash > 0) player.flash = Math.max(0, player.flash - dt * 0.004);
  }

  // 怪物位置插值
  for (const m of monsters) {
    m.px += (m.x * TS - m.px) * k;
    m.py += (m.y * TS - m.py) * k;
    if (m.attackAnim > 0) m.attackAnim = Math.max(0, m.attackAnim - dt * 0.006);
    if (m.flash > 0) m.flash = Math.max(0, m.flash - dt * 0.005);
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.14;
    p.vx *= 0.97;
    p.life -= dt * 0.0024;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // 漂浮文字
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= dt * 0.035;
    f.life -= dt * 0.0015;
    if (f.life <= 0) floaters.splice(i, 1);
  }

  // 屏幕震动衰减
  if (shake > 0) shake = Math.max(0, shake - dt * 0.035);
  if (hitFlash > 0) hitFlash = Math.max(0, hitFlash - dt * 0.0022);
}

function loop(t) {
  const dt = Math.min(60, t - lastT || 16);
  lastT = t;
  update(dt);
  render(t);
  if (logDirty) renderLog();
  requestAnimationFrame(loop);
}

/* ═══════════════════════════════════════════════════════════
   输入
   ═══════════════════════════════════════════════════════════ */
window.addEventListener('keydown', e => {
  const k = e.key;

  if (gameState === 'title') {
    e.preventDefault();
    newGame();
    return;
  }
  if (gameState === 'dead' || gameState === 'win') {
    if (k === 'r' || k === 'R') { e.preventDefault(); newGame(); }
    return;
  }

  const lower = k.toLowerCase();

  // 移动
  if (['arrowup', 'w', 'k'].includes(lower)) { e.preventDefault(); tryMove(0, -1); return; }
  if (['arrowdown', 'w', 'j'].includes(lower) && lower !== 'w') {
    if (lower === 'arrowdown' || lower === 'j') { e.preventDefault(); tryMove(0, 1); return; }
  }
  if (lower === 'arrowdown' || lower === 'j') { e.preventDefault(); tryMove(0, 1); return; }
  if (lower === 'arrowleft' || lower === 'h' || lower === 'a') { e.preventDefault(); tryMove(-1, 0); return; }
  if (lower === 'arrowright' || lower === 'l' || lower === 'd') { e.preventDefault(); tryMove(1, 0); return; }

  // 等待
  if (lower === ' ' || lower === '.') { e.preventDefault(); wait(); return; }

  // 下楼
  if (lower === 'enter' || lower === '>') { e.preventDefault(); descend(); return; }

  // 物品
  if (lower >= '1' && lower <= '6') {
    e.preventDefault();
    useItem(parseInt(lower, 10) - 1);
    return;
  }
});

/* ═══════════════════════════════════════════════════════════
   自适应缩放
   ═══════════════════════════════════════════════════════════ */
const frame = document.getElementById('frame');
function resize() {
  const totalW = 1420 + 40;
  const totalH = 720 + 40;
  const s = Math.min(window.innerWidth / totalW, window.innerHeight / totalH, 1);
  frame.style.transform = `scale(${s})`;
}
window.addEventListener('resize', resize);
resize();

/* ═══════════════════════════════════════════════════════════
   启动
   ═══════════════════════════════════════════════════════════ */
newGame();
gameState = 'title';
overlay.innerHTML = `
  <div class="title">深 渊 回 响</div>
  <div class="subtitle">ECHOES OF THE ABYSS</div>
  <div class="keys">
    移动 &nbsp;<b>方向键 / WASD / HJKL</b><br>
    攻击 &nbsp;<b>朝敌人移动</b><br>
    等待 &nbsp;<b>空格 / .</b><br>
    下楼 &nbsp;<b>站在 ⌄ 上按 Enter 或 &gt;</b><br>
    使用物品 &nbsp;<b>数字键 1 – 6</b><br>
    拾取 &nbsp;<b>自动</b>
  </div>
  <div class="prompt">按 任 意 键 开 始</div>
`;
overlay.style.display = 'flex';

requestAnimationFrame(loop);

</script>
