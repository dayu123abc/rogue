<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101915">
<title>苔痕：沉没王庭</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap');
:root{color-scheme:dark;--bg:#101915;--panel:#19231e;--panel2:#202c25;--line:#39483e;--text:#e8e2ce;--muted:#9ba894;--moss:#a8bd75;--gold:#e7bd6f;--rust:#dd765b;--blue:#8ac4bd;--mono:'DM Mono',Consolas,monospace;--sans:'Noto Sans SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}body{background-image:radial-gradient(ellipse at 20% 0%,rgba(120,151,93,.12),transparent 42%),radial-gradient(ellipse at 95% 100%,rgba(122,99,56,.1),transparent 40%)}button{font:inherit;color:inherit}#app{width:min(1500px,100%);min-height:100vh;margin:auto;padding:18px 22px 20px;display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto 1fr;gap:14px 18px}.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 2px 12px}.brand{display:flex;align-items:baseline;gap:13px}.brand h1{margin:0;font-family:'Ma Shan Zheng',serif;font-size:30px;font-weight:400;letter-spacing:2px;color:#d7d6b2}.brand span{font:10px var(--mono);letter-spacing:2px;color:var(--muted)}.top-actions{display:flex;gap:8px}.icon-btn,.small-btn{border:1px solid var(--line);background:#202a23;border-radius:4px;cursor:pointer}.icon-btn{width:36px;height:34px;font-size:16px}.icon-btn:hover,.small-btn:hover{border-color:var(--moss);color:var(--moss)}#stage{align-self:start;min-width:0;position:relative;overflow:hidden;border:1px solid #51614e;border-radius:5px;background:#0e1411;box-shadow:0 20px 60px #070b09a6,0 0 0 5px #19221c}.canvas-wrap{position:relative;width:100%;aspect-ratio:960/624}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.stage-caption{position:absolute;z-index:1;left:14px;top:12px;display:flex;gap:8px;align-items:center;pointer-events:none;font:10px var(--mono);letter-spacing:1.4px;text-transform:uppercase;text-shadow:0 1px 4px #000}.live-dot{width:7px;height:7px;border-radius:50%;background:#a8bd75;box-shadow:0 0 10px #a8bd75}.side{min-width:0;display:flex;flex-direction:column;gap:10px}.panel{background:linear-gradient(145deg,rgba(32,44,37,.94),rgba(23,33,28,.98));border:1px solid var(--line);border-radius:5px;padding:13px 14px;box-shadow:0 5px 18px #080d0a42}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.eyebrow{font:10px var(--mono);letter-spacing:1.7px;color:var(--muted)}.depth{font:12px var(--mono);color:var(--gold)}.meter{margin:9px 0}.meter-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}.meter-label b{font:11px var(--mono);color:var(--text)}.bar{height:8px;background:#101712;border:1px solid #3a493c;border-radius:2px;overflow:hidden}.bar i{height:100%;display:block;transition:width .2s}.bar.hp i{background:linear-gradient(90deg,#aa4d42,#e17c63)}.bar.food i{background:linear-gradient(90deg,#bf9656,#e8ca7e)}.bar.xp i{background:linear-gradient(90deg,#659e88,#8fceb2)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}.stat{text-align:center;padding:7px 2px 5px;background:#11191470;border:1px solid #344137;border-radius:3px}.stat b{display:block;font:15px var(--mono);color:var(--text)}.stat span{font-size:9px;color:var(--muted)}.equipment{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--muted)}.equipment b{color:var(--gold);font-weight:500}.conditions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.condition{font-size:10px;border:1px solid #57714f;border-radius:2px;padding:2px 6px;color:#bfd493}.condition.bad{border-color:#7c4b42;color:#efa18b}.inventory{display:grid;grid-template-columns:1fr 1fr;gap:5px}.item{display:flex;align-items:center;gap:7px;min-width:0;min-height:37px;text-align:left;padding:5px 7px;border:1px solid #38473c;border-radius:3px;background:#11191480;cursor:pointer}.item:hover{border-color:#a8bd75;background:#263329}.item[disabled]{opacity:.42;cursor:default}.item-glyph{font:16px var(--mono);color:var(--gold);width:17px;text-align:center}.item-name{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.item-count{font:10px var(--mono);color:var(--muted)}.empty{grid-column:1/-1;color:#788273;font-size:11px;padding:4px 1px}.log{height:160px;overflow:auto;display:flex;flex-direction:column-reverse;gap:5px;font-size:11px;line-height:1.5;scrollbar-color:#586650 #18211b;scrollbar-width:thin}.log p{margin:0;color:#b9c1ad}.log p:first-child{color:#e4dec9}.log .danger{color:#e48b72}.log .loot{color:#e6c37a}.log .good{color:#a8cc9a}.log .hint{color:#85c0b0}.tips{color:var(--muted);font-size:10px;line-height:1.8}.tips kbd{font:10px var(--mono);color:var(--text);border:1px solid #566151;border-bottom-width:2px;border-radius:3px;padding:1px 4px;background:#111914}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:linear-gradient(90deg,#101713e8,#101713a8 60%,#101713d9);backdrop-filter:blur(2px)}.overlay.hidden{display:none}.intro{width:min(450px,100%);padding:26px 28px;border-left:2px solid var(--moss);background:#151e19ed;box-shadow:0 15px 50px #050806b8}.intro .kicker{font:10px var(--mono);letter-spacing:2px;color:var(--moss)}.intro h2{font-family:'Ma Shan Zheng',serif;font-size:40px;font-weight:400;letter-spacing:2px;margin:9px 0 2px;color:#e5d7ad}.intro .sub{font:11px var(--mono);letter-spacing:1.4px;color:#91a48a}.intro p{font-size:13px;line-height:1.8;color:#c2c9b9;margin:18px 0}.traits{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 19px}.traits span{font-size:10px;color:#c0c6b1;padding:4px 7px;border:1px solid #414e3d;background:#1b271f}.primary{border:1px solid #c5c98c;background:#9eae6e;color:#182018;padding:10px 18px;border-radius:3px;font-weight:700;cursor:pointer}.primary:hover{background:#cad58d}.note{font-size:10px;color:#81907e;margin-top:13px}.defeat{font-size:30px;font-family:'Ma Shan Zheng',serif;color:#e29b7f;margin:0 0 5px}.mobile-controls{display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:4px;justify-content:center}.mobile-controls button{background:#202b24;border:1px solid #4c5947;border-radius:3px;font:16px var(--mono)}.mobile-controls .wait{font:10px var(--sans)}
@media(max-width:850px){#app{grid-template-columns:minmax(0,1fr) 280px;padding:12px;gap:12px} .brand h1{font-size:26px}}
@media(max-width:680px){#app{display:flex;flex-direction:column;padding:10px;gap:10px}.topbar{padding-bottom:8px}.brand{gap:8px}.brand h1{font-size:23px}.brand span{font-size:8px;letter-spacing:1px}.top-actions{gap:5px}.icon-btn{width:32px;height:31px}#stage{width:100%;align-self:stretch}.side{display:grid;grid-template-columns:1fr 1fr;align-items:start}.panel{padding:10px}.panel:first-child{grid-column:1/-1}.panel.log-panel{grid-column:1/-1}.log{height:105px}.tips-panel{grid-column:1/-1}.mobile-controls{display:grid}.stats{margin-top:8px}.panel-head{margin-bottom:7px}.stage-caption{font-size:8px;top:8px;left:9px}}
@media(max-width:390px){.side{grid-template-columns:1fr}.panel:first-child,.panel.log-panel,.tips-panel{grid-column:auto}.inventory{grid-template-columns:1fr 1fr}.brand span{display:none}}
</style>
</head>
<body>
<main id="app">
	<header class="topbar"><div class="brand"><h1>苔痕</h1><span>THE SUNKEN COURT · BERLIN ROGUELIKE</span></div><div class="top-actions"><button class="icon-btn" id="soundBtn" title="音效开关" aria-label="音效开关">♫</button><button class="icon-btn" id="helpBtn" title="查看说明" aria-label="查看说明">?</button></div></header>
	<section id="stage"><div class="canvas-wrap"><canvas id="world" width="960" height="624" aria-label="地牢地图"></canvas><div class="stage-caption"><i class="live-dot"></i><span id="caption">地表遗迹 · 入口</span></div><div class="overlay" id="overlay"><div class="intro" id="intro"></div></div></div></section>
	<aside class="side">
		<section class="panel"><div class="panel-head"><span class="eyebrow">探险者状态</span><span class="depth" id="depth">深度 01 / 08</span></div><div class="meter"><div class="meter-label"><span>生命</span><b id="hpText">24 / 24</b></div><div class="bar hp"><i id="hpBar"></i></div></div><div class="meter"><div class="meter-label"><span>饱食</span><b id="foodText">100 / 100</b></div><div class="bar food"><i id="foodBar"></i></div></div><div class="meter"><div class="meter-label"><span>经验</span><b id="xpText">0 / 12</b></div><div class="bar xp"><i id="xpBar"></i></div></div><div class="stats"><div class="stat"><b id="level">1</b><span>等级</span></div><div class="stat"><b id="attack">2–5</b><span>攻击</span></div><div class="stat"><b id="defense">1</b><span>防御</span></div><div class="stat"><b id="gold">0</b><span>金币</span></div></div><div class="equipment" id="equipment"></div><div class="conditions" id="conditions"></div></section>
		<section class="panel"><div class="panel-head"><span class="eyebrow">行囊</span><span class="eyebrow" id="itemSlots">0 / 12</span></div><div class="inventory" id="inventory"></div></section>
		<section class="panel log-panel"><div class="panel-head"><span class="eyebrow">旅途记录</span><span class="eyebrow" id="turns">第 0 回合</span></div><div class="log" id="log" aria-live="polite"></div></section>
		<section class="panel tips-panel"><div class="panel-head"><span class="eyebrow">行动</span><span class="eyebrow">回合制</span></div><div class="tips"><kbd>WASD</kbd> / <kbd>方向键</kbd> 移动、攻击　<kbd>.</kbd> 等待<br><kbd>E</kbd> 拾取　<kbd>&gt;</kbd> 下楼　<kbd>空格</kbd> 等待<br>撞击怪物攻击；点击背包使用道具。</div></section>
		<div class="mobile-controls" aria-label="触屏方向键"><span></span><button data-move="0,-1">↑</button><span></span><button data-move="-1,0">←</button><button class="wait" id="waitTouch">等待</button><button data-move="1,0">→</button><span></span><button data-move="0,1">↓</button><span></span></div>
	</aside>
</main>
<script>
'use strict';
(() => {
	const canvas = document.getElementById('world');
	const ctx = canvas.getContext('2d');
	const W = canvas.width, H = canvas.height, TILE = 24, VIEW_W = W / TILE, VIEW_H = H / TILE;
	const MAP_W = 76, MAP_H = 58, MAX_FLOOR = 8;
	const $ = id => document.getElementById(id);
	const rand = n => Math.floor(Math.random() * n);
	const between = (a, b) => a + rand(b - a + 1);
	const choose = list => list[rand(list.length)];
	const keyOf = (x, y) => `${x},${y}`;
	const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
	const names = ['盐雾回廊','苔井旧城','沉钟墓室','王庭下层','无月蓄水池','断誓圣所','根须王座'];
	const enemyKinds = [
		{name:'穴鼠',glyph:'r',hp:5,atk:[1,3],def:0,xp:3,color:'#c8b08a',gold:[1,3]},
		{name:'苔甲虫',glyph:'b',hp:8,atk:[2,4],def:1,xp:5,color:'#a9b96d',gold:[2,5]},
		{name:'失誓侍卫',glyph:'s',hp:12,atk:[3,6],def:1,xp:8,color:'#d58b69',gold:[3,7]},
		{name:'井中幽灵',glyph:'w',hp:9,atk:[3,7],def:0,xp:9,color:'#8bc7b3',gold:[2,8]},
		{name:'盐骨巨像',glyph:'G',hp:21,atk:[5,9],def:3,xp:14,color:'#d3bd89',gold:[6,12]}
	];
	const potionEffects = [
		{id:'heal',name:'绛红药剂',description:'生命恢复 10',apply:g=>{const v=Math.min(10,g.player.maxHp-g.player.hp);g.player.hp+=v;message(`温热的药液修复了 ${v} 点生命。`,'good');}},
		{id:'poison',name:'浑浊药剂',description:'中毒 5 回合',apply:g=>{g.player.poison=5;message('毒素沿血脉扩散。','danger');}},
		{id:'might',name:'金辉药剂',description:'永久增加 1 点攻击',apply:g=>{g.player.bonusAtk++;message('力量涌入双臂，攻击永久提升。','good');}},
		{id:'clarity',name:'清明药剂',description:'恢复 18 点饱食',apply:g=>{g.player.food=Math.min(100,g.player.food+18);message('清凉感驱散了饥饿。','good');}},
		{id:'vigor',name:'青瓷药剂',description:'生命上限与当前生命 +4',apply:g=>{g.player.maxHp+=4;g.player.hp+=4;message('你的生命力变得更加充盈。','good');}}
	];
	const scrollEffects = [
		{id:'fire',name:'焦痕卷轴',description:'灼烧视野内最近的敌人',apply:g=>{const e=nearestEnemy(g,8);if(e){e.hp-=14;message(`火焰吞没了${e.name}！`,'good');if(e.hp<=0)killEnemy(g,e);}else{message('卷轴亮起，附近却没有敌人。','hint');}}},
		{id:'blink',name:'褪色卷轴',description:'传送至附近空地',apply:g=>{const spots=[];for(let y=1;y<MAP_H-1;y++)for(let x=1;x<MAP_W-1;x++)if(g.map[y][x]===1&&!g.monsters.some(m=>m.x===x&&m.y===y)&&!g.items.some(i=>i.x===x&&i.y===y))spots.push({x,y});if(spots.length){const p=choose(spots.filter(p=>Math.abs(p.x-g.player.x)+Math.abs(p.y-g.player.y)>6));if(p){g.player.x=p.x;g.player.y=p.y;message('空间折叠，你落在另一处石地上。','hint');}}}},
		{id:'ward',name:'护佑卷轴',description:'获得 8 点临时护盾',apply:g=>{g.player.shield+=8;message('符文护盾在身边亮起。','good');}},
		{id:'reveal',name:'墨迹卷轴',description:'揭开本层整幅地图',apply:g=>{for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++)if(g.map[y][x]!==0)g.seen[y][x]=1;message('地图在脑海中展开。','hint');}}
	];
	let game=null, audioOn=false, audioCtx=null, animTick=0;
	function message(text,kind=''){if(!game)return;game.logs.unshift({text,kind});game.logs=game.logs.slice(0,34);renderLog();}
	function renderLog(){ $('log').innerHTML=game.logs.slice(0,12).map(x=>`<p class="${x.kind}">${escapeHtml(x.text)}</p>`).join(''); }
	function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
	function newRun(){
		game={floor:1,turn:0,map:[],seen:[],rooms:[],monsters:[],items:[],traps:[],player:{x:0,y:0,hp:24,maxHp:24,food:100,xp:0,level:1,baseAtk:[2,5],bonusAtk:0,def:1,bonusDef:0,gold:0,weapon:'锈蚀短剑',armor:'旧皮衣',poison:0,shield:0,inventory:[],kills:0},logs:[],stairs:null,exit:null,dead:false,won:false,identified:{},revealed:new Set(),seed:Math.random().toString(36).slice(2,8)};
		generateFloor();message('你踏入了沉没王庭。石缝里有风。','hint');message('找出楼梯，活着抵达第八层。');$('overlay').classList.add('hidden');document.body.focus();draw();updateUI();
	}
	function carve(x,y){if(x>0&&y>0&&x<MAP_W-1&&y<MAP_H-1)game.map[y][x]=1;}
	function roomOverlap(a,b){return a.x<=b.x+b.w+1&&a.x+a.w+1>=b.x&&a.y<=b.y+b.h+1&&a.y+a.h+1>=b.y;}
	function carveRoom(r){for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)carve(x,y);}
	function connectRooms(a,b){let x=between(a.x+1,a.x+a.w-2),y=between(a.y+1,a.y+a.h-2),tx=between(b.x+1,b.x+b.w-2),ty=between(b.y+1,b.y+b.h-2);if(Math.random()<.5){while(x!==tx){carve(x,y);x+=Math.sign(tx-x);}while(y!==ty){carve(x,y);y+=Math.sign(ty-y);}}else{while(y!==ty){carve(x,y);y+=Math.sign(ty-y);}while(x!==tx){carve(x,y);x+=Math.sign(tx-x);}}carve(tx,ty);}
	function generateFloor(){
		game.map=Array.from({length:MAP_H},()=>Array(MAP_W).fill(0));game.seen=Array.from({length:MAP_H},()=>Array(MAP_W).fill(0));game.rooms=[];game.monsters=[];game.items=[];game.traps=[];
		for(let i=0;i<90&&game.rooms.length<15;i++){const r={x:between(2,MAP_W-14),y:between(2,MAP_H-12),w:between(6,12),h:between(5,9)};if(game.rooms.every(old=>!roomOverlap(r,old))){carveRoom(r);if(game.rooms.length)connectRooms(game.rooms[game.rooms.length-1],r);game.rooms.push(r);}}
		if(game.rooms.length<2){const r={x:4,y:4,w:9,h:8};carveRoom(r);game.rooms=[r,{x:35,y:22,w:10,h:8}];carveRoom(game.rooms[1]);connectRooms(game.rooms[0],game.rooms[1]);}
		const start=game.rooms[0],last=game.rooms[game.rooms.length-1];game.player.x=start.x+Math.floor(start.w/2);game.player.y=start.y+Math.floor(start.h/2);game.stairs={x:last.x+Math.floor(last.w/2),y:last.y+Math.floor(last.h/2)};
		if(game.floor===MAX_FLOOR)game.exit={x:game.stairs.x,y:game.stairs.y};
		const count=7+game.floor*2;
		for(let i=0;i<count;i++){const r=choose(game.rooms.slice(1));const p=emptySpot(r);if(!p)continue;let pool=enemyKinds.slice(0,Math.min(enemyKinds.length,2+Math.floor(game.floor/2)));const base=choose(pool);const scale=1+(game.floor-1)*.14;game.monsters.push({...base,x:p.x,y:p.y,hp:Math.round(base.hp*scale),maxHp:Math.round(base.hp*scale),atk:[Math.max(1,base.atk[0]+Math.floor((game.floor-1)/3)),base.atk[1]+Math.floor((game.floor-1)/2)],alive:true});}
		if(game.floor===MAX_FLOOR){const p={x:game.stairs.x,y:game.stairs.y};game.monsters.push({name:'沉王·奥铎',glyph:'D',x:p.x,y:p.y,hp:90,maxHp:90,atk:[8,14],def:4,xp:60,color:'#df8063',gold:[40,65],alive:true,boss:true});}
		for(let i=0;i<6+game.floor;i++){const p=emptySpot(choose(game.rooms));if(p)game.items.push({...p,type:'food',name:choose(['腌蘑菇','干果','盐渍鱼']),glyph:'%',count:1,value:22});}
		for(let i=0;i<4+Math.floor(game.floor/2);i++){const p=emptySpot(choose(game.rooms));if(!p)continue;const typ=Math.random()<.58?'potion':'scroll';game.items.push({...p,type:typ,name:typ==='potion'?'未鉴定药剂':'封蜡卷轴',glyph:typ==='potion'?'!':'?',effect:choose(typ==='potion'?potionEffects:scrollEffects),identified:false});}
		for(let i=0;i<4;i++){const p=emptySpot(choose(game.rooms));if(p)game.items.push({...p,type:'gold',name:'散落的金币',glyph:'$',count:between(3,10+game.floor*2)});}
		if(game.floor%2===0){const p=emptySpot(choose(game.rooms));if(p)game.items.push({...p,type:'weapon',name:'王庭卫士长枪',glyph:'†',bonus:2});}
		for(let i=0;i<2+Math.floor(game.floor/3);i++){const p=emptySpot(choose(game.rooms));if(p)game.traps.push({...p,armed:true,seen:false});}
		reveal();
	}
	function emptySpot(room){for(let tries=0;tries<90;tries++){const x=between(room.x+1,room.x+room.w-2),y=between(room.y+1,room.y+room.h-2);if(game.map[y]?.[x]===1&&!(game.player.x===x&&game.player.y===y)&&!game.monsters.some(m=>m.x===x&&m.y===y)&&!game.items.some(i=>i.x===x&&i.y===y)&&!(game.stairs?.x===x&&game.stairs?.y===y))return{x,y};}return null;}
	function walkable(x,y){return game.map[y]?.[x]===1;}
	function visibleLine(x0,y0,x1,y1){let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,err=dx+dy;while(true){if(x0===x1&&y0===y1)return true;if(!(x0===game.player.x&&y0===game.player.y)&&!walkable(x0,y0))return false;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx;}if(e2<=dx){err+=dx;y0+=sy;}}}
	function canSee(x,y){return Math.abs(x-game.player.x)<=8&&Math.abs(y-game.player.y)<=7&&visibleLine(game.player.x,game.player.y,x,y);}
	function reveal(){for(let y=Math.max(0,game.player.y-8);y<=Math.min(MAP_H-1,game.player.y+8);y++)for(let x=Math.max(0,game.player.x-8);x<=Math.min(MAP_W-1,game.player.x+8);x++)if(canSee(x,y))game.seen[y][x]=1;for(const t of game.traps)if(canSee(t.x,t.y))t.seen=true;}
	function monsterAt(x,y){return game.monsters.find(m=>m.alive&&m.x===x&&m.y===y);}
	function itemAt(x,y){return game.items.find(i=>i.x===x&&i.y===y);}
	function step(dx,dy){if(!game||game.dead||game.won)return;const p=game.player,nx=p.x+dx,ny=p.y+dy;if(!walkable(nx,ny)){const e=game.map[ny]?.[nx]===2?'石门挡住了去路。':'墙壁挡住了去路。';message(e);return;}const target=monsterAt(nx,ny);if(target){attack(target);advanceTurn();return;}p.x=nx;p.y=ny;const trap=game.traps.find(t=>t.x===nx&&t.y===ny&&t.armed);if(trap){trap.armed=false;const dmg=between(3,6+Math.floor(game.floor/2));p.hp-=dmg;message(`你踩中机关，尖刺刺入身体（-${dmg}）。`,'danger');}const item=itemAt(nx,ny);if(item)pickup(item);if(nx===game.stairs.x&&ny===game.stairs.y&&game.floor<MAX_FLOOR)message('石阶通向更深处。按 > 下楼。','hint');if(game.exit&&nx===game.exit.x&&ny===game.exit.y&&!monsterAt(nx,ny))message('王座后的出口仍被沉王挡住。','hint');advanceTurn();}
	function attack(enemy){const p=game.player,damage=Math.max(1,between(p.baseAtk[0],p.baseAtk[1])+p.bonusAtk-enemy.def);enemy.hp-=damage;message(`你击中${enemy.name}，造成 ${damage} 点伤害。`, 'good');sound(170);if(enemy.hp<=0)killEnemy(game,enemy);}
	function killEnemy(g,enemy){if(!enemy.alive)return;enemy.alive=false;g.player.xp+=enemy.xp;g.player.gold+=between(enemy.gold[0],enemy.gold[1]);g.player.kills++;message(`${enemy.name}倒下了。获得 ${enemy.xp} 经验。`,'loot');if(enemy.boss){g.won=true;showEnd(true);return;}while(g.player.xp>=g.player.level*12){g.player.xp-=g.player.level*12;g.player.level++;g.player.maxHp+=4;g.player.hp=Math.min(g.player.maxHp,g.player.hp+7);g.player.bonusAtk++;g.player.def++;message(`升至 ${g.player.level} 级：生命、攻击与防御提升。`,'good');}}
	function advanceTurn(){if(game.dead||game.won)return;game.turn++;const p=game.player;p.food=Math.max(0,p.food-1);if(game.turn%18===0&&p.food>0){p.hp=Math.min(p.maxHp,p.hp+1);message('歇息片刻，生命恢复 1 点。','good');}if(p.food===0&&game.turn%4===0){p.hp--;message('饥饿正在吞噬你。','danger');}if(p.poison>0){p.hp--;p.poison--;if(p.poison===0)message('毒性终于散去了。','good');}enemyTurn();if(p.hp<=0){p.hp=0;game.dead=true;showEnd(false);}reveal();updateUI();draw();}
	function enemyTurn(){const p=game.player;for(const e of game.monsters){if(!e.alive||!canSee(e.x,e.y))continue;const dist=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);if(dist===1){hurtPlayer(e);continue;}if(dist<8){const options=[[0,-1],[-1,0],[1,0],[0,1]].sort(()=>Math.random()-.5);for(const[dx,dy]of options){const nx=e.x+dx,ny=e.y+dy;if(walkable(nx,ny)&&!monsterAt(nx,ny)&&!(nx===p.x&&ny===p.y)){const old=Math.abs(e.x-p.x)+Math.abs(e.y-p.y),next=Math.abs(nx-p.x)+Math.abs(ny-p.y);if(next<old){e.x=nx;e.y=ny;break;}}}}}}
	function hurtPlayer(enemy){const p=game.player,raw=between(enemy.atk[0],enemy.atk[1]),blocked=Math.min(raw,p.def+p.bonusDef),dmg=Math.max(0,raw-blocked);let remain=dmg;if(p.shield){const absorbed=Math.min(p.shield,remain);p.shield-=absorbed;remain-=absorbed;}p.hp-=remain;message(`${enemy.name}攻击你（-${remain}）。${blocked?`防御抵消 ${blocked} 点。`:''}`,'danger');sound(85);}
	function pickup(item){if(item.type==='food'){game.player.food=Math.min(100,game.player.food+item.value);message(`吃下${item.name}，饱食恢复 ${item.value}。`,'good');removeItem(item);return;}if(item.type==='gold'){game.player.gold+=item.count;message(`拾取 ${item.count} 枚金币。`,'loot');removeItem(item);return;}if(item.type==='weapon'){game.player.bonusAtk+=item.bonus;game.player.weapon=item.name;message(`装备${item.name}，攻击永久提升 ${item.bonus}。`,'loot');removeItem(item);return;}if(game.player.inventory.length>=12){message(`${item.name}落在脚边：行囊已满。`);return;}game.player.inventory.push(item);message(`拾起${item.name}。`,'loot');removeItem(item);}
	function removeItem(i){game.items=game.items.filter(x=>x!==i);}
	function useItem(index){if(!game||game.dead||game.won)return;const item=game.player.inventory[index];if(!item)return;if(item.type==='food'){game.player.food=Math.min(100,game.player.food+item.value);message(`吃下${item.name}，饱食恢复 ${item.value}。`,'good');}else if(item.type==='potion'||item.type==='scroll'){item.effect.apply(game);if(!item.identified){item.identified=true;game.identified[item.effect.id]=true;message(`你辨认出这是${item.effect.name}。`,'hint');}}else return;game.player.inventory.splice(index,1);advanceTurn();}
	function descend(){if(!game||game.dead||game.won)return;if(game.player.x!==game.stairs.x||game.player.y!==game.stairs.y){message('你必须站在石阶上才能继续。','hint');return;}if(game.floor>=MAX_FLOOR){message('王庭的出口还未开启。','danger');return;}game.floor++;generateFloor();message(`你踏入${names[game.floor-1]||'更深处'}。`,'hint');sound(330);updateUI();draw();}
	function nearestEnemy(g,range){return g.monsters.filter(e=>e.alive&&canSee(e.x,e.y)&&Math.abs(e.x-g.player.x)+Math.abs(e.y-g.player.y)<=range).sort((a,b)=>(Math.abs(a.x-g.player.x)+Math.abs(a.y-g.player.y))-(Math.abs(b.x-g.player.x)+Math.abs(b.y-g.player.y)))[0];}
	function wait(){if(!game||game.dead||game.won)return;message('你屏息聆听，黑暗中有水滴落下。','hint');advanceTurn();}
	function draw(){if(!game)return;animTick++;ctx.clearRect(0,0,W,H);const camX=clamp(game.player.x-Math.floor(VIEW_W/2),0,MAP_W-VIEW_W),camY=clamp(game.player.y-Math.floor(VIEW_H/2),0,MAP_H-VIEW_H);const light=ctx.createRadialGradient((game.player.x-camX+.5)*TILE,(game.player.y-camY+.5)*TILE,18,(game.player.x-camX+.5)*TILE,(game.player.y-camY+.5)*TILE,250);light.addColorStop(0,'rgba(221,195,128,.12)');light.addColorStop(1,'rgba(8,13,10,0)');
		for(let sy=0;sy<VIEW_H;sy++)for(let sx=0;sx<VIEW_W;sx++){const x=camX+sx,y=camY+sy,t=game.map[y]?.[x]||0,seen=game.seen[y]?.[x];const px=sx*TILE,py=sy*TILE;if(!seen){ctx.fillStyle='#0c120f';ctx.fillRect(px,py,TILE,TILE);continue;}if(t===1){ctx.fillStyle='#38443a';ctx.fillRect(px,py,TILE,TILE);ctx.fillStyle=((x*17+y*31)%7===0)?'#53634b':'#465444';ctx.fillRect(px+2,py+2,((x*11+y*3)%17)+2,1);ctx.fillStyle='#354137';ctx.fillRect(px+2,py+TILE-4,TILE-4,1);if((x*13+y*19)%17===0){ctx.fillStyle='#77805a';ctx.fillRect(px+5+(x%8),py+5+(y%9),2,3);}}else{ctx.fillStyle='#202a24';ctx.fillRect(px,py,TILE,TILE);ctx.fillStyle='#30392f';ctx.fillRect(px+2,py+2,TILE-4,TILE-4);ctx.fillStyle='#4b5040';ctx.fillRect(px+2,py+2,TILE-4,2);ctx.fillStyle='#19221d';ctx.fillRect(px+2,py+TILE-3,TILE-4,1);}
			ctx.strokeStyle='rgba(9,15,11,.28)';ctx.strokeRect(px+.5,py+.5,TILE,TILE);
			if(x===game.stairs.x&&y===game.stairs.y){ctx.fillStyle='#a5ad79';ctx.fillRect(px+5,py+7,14,11);ctx.fillStyle='#323b2a';ctx.fillRect(px+8,py+9,8,2);ctx.fillRect(px+9,py+13,6,2);drawGlyph('↓',px+12,py+7,'#e4d498',13);}
			const trap=game.traps.find(t=>t.x===x&&t.y===y&&t.seen&&t.armed);if(trap)drawGlyph('⌃',px+12,py+12,'#bd755f',15);
			const item=itemAt(x,y);if(item)drawGlyph(item.glyph,px+12,py+13,item.type==='food'?'#a6c080':item.type==='gold'?'#e7c46e':item.type==='weapon'?'#c6cda1':item.type==='potion'?'#de8e77':'#91c1b2',16);
			const enemy=monsterAt(x,y);if(enemy)drawEnemy(enemy,px,py);
		}
		ctx.fillStyle=light;ctx.fillRect(0,0,W,H);
		const p=game.player,sx=(p.x-camX)*TILE,sy=(p.y-camY)*TILE;drawPlayer(sx,sy);
		const vignette=ctx.createRadialGradient(W/2,H/2,180,W/2,H/2,690);vignette.addColorStop(0,'rgba(0,0,0,0)');vignette.addColorStop(1,'rgba(0,0,0,.27)');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
		ctx.fillStyle='rgba(7,12,9,.82)';ctx.fillRect(0,H-22,W,22);ctx.fillStyle='#a6ad91';ctx.font='10px "DM Mono",monospace';ctx.fillText(`DEPTH ${String(game.floor).padStart(2,'0')}   ·   ${game.seed.toUpperCase()}   ·   ${game.monsters.filter(m=>m.alive).length} HOSTILES`,12,H-7);
	}
	function drawGlyph(g,x,y,color,size){ctx.font=`bold ${size}px "DM Mono",monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=color;ctx.shadowBlur=7;ctx.fillStyle=color;ctx.fillText(g,x,y);ctx.shadowBlur=0;}
	function drawEnemy(e,x,y){ctx.fillStyle=e.boss?'#5b2923':'#263028';ctx.beginPath();ctx.ellipse(x+12,y+15,9,7,0,0,Math.PI*2);ctx.fill();drawGlyph(e.glyph,x+12,y+11,e.color, e.boss?20:16);if(e.hp<e.maxHp){ctx.fillStyle='#141914';ctx.fillRect(x+3,y+1,18,3);ctx.fillStyle='#ce7662';ctx.fillRect(x+3,y+1,18*e.hp/e.maxHp,3);}}
	function drawPlayer(x,y){const bob=Math.sin(animTick/4)*.7;ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(x+12,y+19,8,3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b9b17e';ctx.beginPath();ctx.arc(x+12,y+8+bob,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#52664d';ctx.fillRect(x+6,y+11+bob,12,8);ctx.fillStyle='#d8c592';ctx.fillRect(x+10,y+5+bob,2,2);ctx.fillStyle='#d5d0a4';ctx.fillRect(x+18,y+10+bob,2,10);}
	function updateUI(){const p=game.player;$('depth').textContent=`深度 ${String(game.floor).padStart(2,'0')} / 08`;$('caption').textContent=`${names[game.floor-1]||'王庭深处'} · ${game.floor===8?'沉王王座':'下层遗迹'}`;$('hpText').textContent=`${p.hp} / ${p.maxHp}`;$('hpBar').style.width=`${100*p.hp/p.maxHp}%`;$('foodText').textContent=`${p.food} / 100`;$('foodBar').style.width=`${p.food}%`;$('xpText').textContent=`${p.xp} / ${p.level*12}`;$('xpBar').style.width=`${100*p.xp/(p.level*12)}%`;$('level').textContent=p.level;$('attack').textContent=`${p.baseAtk[0]+p.bonusAtk}–${p.baseAtk[1]+p.bonusAtk}`;$('defense').textContent=p.def+p.bonusDef;$('gold').textContent=p.gold;$('turns').textContent=`第 ${game.turn} 回合`;$('equipment').innerHTML=`兵器 <b>${escapeHtml(p.weapon)}</b>　护甲 <b>${escapeHtml(p.armor)}</b>`;$('conditions').innerHTML=[p.poison?`<span class="condition bad">中毒 ${p.poison}</span>`:'',p.shield?`<span class="condition">护盾 ${p.shield}</span>`:'',p.food===0?'<span class="condition bad">饥饿</span>':''].join('');$('itemSlots').textContent=`${p.inventory.length} / 12`;$('inventory').innerHTML=p.inventory.length?p.inventory.map((it,i)=>{const label=it.identified?it.effect.name:it.name;return `<button class="item" data-item="${i}" title="${escapeHtml(it.effect?.description||'点击使用')}"><span class="item-glyph">${it.glyph}</span><span class="item-name">${escapeHtml(label)}</span><span class="item-count">使用</span></button>`;}).join(''):'<span class="empty">行囊空空，探索石室寻找补给。</span>';document.querySelectorAll('[data-item]').forEach(b=>b.addEventListener('click',()=>useItem(Number(b.dataset.item))));}
	function showStart(){game={floor:1,turn:0,player:{hp:24,maxHp:24,food:100,xp:0,level:1,baseAtk:[2,5],bonusAtk:0,def:1,bonusDef:0,gold:0,weapon:'锈蚀短剑',armor:'旧皮衣',inventory:[],poison:0,shield:0},logs:[]};$('intro').innerHTML=`<div class="kicker">A PROCEDURAL DUNGEON · PERMADEATH</div><h2>苔痕：沉没王庭</h2><div class="sub">THE SUNKEN COURT</div><p>深入被潮水遗忘的王庭。每次冒险都会生成新的地牢；饥饿、机关与游荡者不会等你。带着王印活着离开，或者留在苔藓之下。</p><div class="traits"><span>程序生成</span><span>永久死亡</span><span>回合制</span><span>网格移动</span><span>资源管理</span><span>未鉴定道具</span></div><button class="primary" id="startBtn">进入遗迹　↗</button><div class="note">键盘 WASD / 方向键，移动到怪物身上即可攻击。每一步都是一个回合。</div>`;$('overlay').classList.remove('hidden');$('startBtn').addEventListener('click',newRun);drawTitle();}
	function drawTitle(){ctx.fillStyle='#121a15';ctx.fillRect(0,0,W,H);for(let i=0;i<130;i++){const x=(i*97)%W,y=(i*163)%H;ctx.fillStyle=i%3?'#1c2a21':'#263326';ctx.fillRect(x,y,between(8,50),1);}ctx.fillStyle='#394735';for(let y=180;y<480;y+=26){ctx.fillRect(90,y,780,2);ctx.fillRect(110,y+5,2,18);ctx.fillRect(845,y+5,2,18);}for(let i=0;i<12;i++){ctx.fillStyle=`rgba(164,184,116,${.03+i*.005})`;ctx.beginPath();ctx.arc(480,310,30+i*19,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#d4c89f';ctx.font='bold 50px "Ma Shan Zheng",serif';ctx.textAlign='center';ctx.fillText('苔痕',480,240);ctx.fillStyle='#8a9a7c';ctx.font='12px "DM Mono",monospace';ctx.fillText('THE SUNKEN COURT',480,270);}
	function showEnd(win){$('overlay').classList.remove('hidden');const p=game.player;$('intro').innerHTML=`<div class="kicker">${win?'THE SEAL IS RESTORED':'THE DUNGEON CLAIMS ANOTHER'}</div><h2 class="defeat">${win?'王庭重归寂静':'旅途止于此处'}</h2><p>${win?'沉王的王印在你掌中渐渐冷却。你穿过崩塌的王庭，带着故事回到了地表。':'黑暗合拢在身后。地牢会记住你的足迹，却不会替你留路。'}</p><div class="traits"><span>深入 ${game.floor} 层</span><span>击败 ${p.kills} 个敌人</span><span>等级 ${p.level}</span><span>${p.gold} 金币</span></div><button class="primary" id="againBtn">再入地牢　↗</button><div class="note">本次世界种子 ${game.seed.toUpperCase()}</div>`;$('againBtn').addEventListener('click',newRun);}
	function sound(freq){if(!audioOn)return;try{audioCtx ||= new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='triangle';g.gain.value=.035;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.1);o.stop(audioCtx.currentTime+.1);}catch{}}
	function help(){if(!game){return;}message('移动/攻击：WASD 或方向键；等待：. / 空格；拾取：E；下楼：>。','hint');message('攻击撞向敌人，拾取踩过物品，点击行囊使用。食物能延缓饥饿。','hint');}
	document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(!game){if(k==='enter')newRun();return;}if(k==='w'||k==='arrowup')step(0,-1);else if(k==='s'||k==='arrowdown')step(0,1);else if(k==='a'||k==='arrowleft')step(-1,0);else if(k==='d'||k==='arrowright')step(1,0);else if(k==='.'||k===' '||k==='5')wait();else if(k==='>'||k==='e'&&e.shiftKey)descend();else if(k==='e'){const it=itemAt(game.player.x,game.player.y);if(it)pickup(it);else message('脚下没有可拾取的物品。');}else if(k==='?')help();});
	document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const[x,y]=b.dataset.move.split(',').map(Number);step(x,y);}));$('waitTouch').addEventListener('click',wait);$('helpBtn').addEventListener('click',help);$('soundBtn').addEventListener('click',()=>{audioOn=!audioOn;$('soundBtn').textContent=audioOn?'♫':'♪';$('soundBtn').title=audioOn?'关闭音效':'开启音效';});
	$('stage').addEventListener('click',e=>{if(!game||game.dead||game.won)return;const r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*VIEW_W),y=Math.floor((e.clientY-r.top)/r.height*VIEW_H),camX=clamp(game.player.x-Math.floor(VIEW_W/2),0,MAP_W-VIEW_W),camY=clamp(game.player.y-Math.floor(VIEW_H/2),0,MAP_H-VIEW_H),dx=camX+x-game.player.x,dy=camY+y-game.player.y;if(Math.abs(dx)+Math.abs(dy)===1)step(dx,dy);});
	showStart();
})();
</script>
